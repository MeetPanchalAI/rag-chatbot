<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document Chatbot</title>
<style>
:root {
  color-scheme: light;
  --bg:        #f6f7f9;
  --panel:     #ffffff;
  --raised:    #fbfbfc;
  --ink:       #14161a;
  --ink-2:     #4a5158;
  --muted:     #767f8a;
  --line:      #e3e6ea;
  --line-soft: #eef0f3;
  --accent:    #2a78d6;
  --accent-ink:#1c5cab;
  --accent-bg: #eaf1fd;
  --amber:     #b45309;
  --amber-bg:  #fdf6ec;
  --good:      #067647;
  --bad:       #b42318;
  --meter-track:#cde2fb;
  --meter-fill: #2a78d6;
  --r:  10px;
  --r-s: 7px;
  --shadow: 0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #0f1115;
    --panel:     #171a1f;
    --raised:    #1c2027;
    --ink:       #e9ecf0;
    --ink-2:     #b6bdc7;
    --muted:     #8b939e;
    --line:      #282d35;
    --line-soft: #21252b;
    --accent:    #3987e5;
    --accent-ink:#8fbaf5;
    --accent-bg: #172234;
    --amber:     #e8a13a;
    --amber-bg:  #241d12;
    --good:      #4ade80;
    --bad:       #f97066;
    --meter-track:#1c5cab;
    --meter-fill: #3987e5;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }

/* ---------- chrome ---------- */

header {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  padding: 0 18px; height: 52px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.mark {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
header h1 { font-size: 14.5px; }
.status {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line);
  padding: 4px 11px; border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.dot.off { background: var(--bad); }

main { flex: 1; display: flex; min-height: 0; }

/* ---------- sidebar ---------- */

aside {
  width: 264px; flex-shrink: 0; background: var(--panel);
  border-right: 1px solid var(--line); overflow-y: auto;
  padding: 16px 14px 24px;
}
aside section + section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
.legend {
  display: flex; align-items: center; gap: 8px; margin: 0 4px 10px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted);
}
.legend .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
.legend button { margin-left: auto; }

button {
  font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 7px 12px;
  transition: background .13s ease, border-color .13s ease, color .13s ease;
}
button:hover:not(:disabled) { background: var(--raised); border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
button.ghost { border-color: transparent; background: none; color: var(--muted); padding: 4px 8px; }
button.ghost:hover:not(:disabled) { background: var(--raised); color: var(--ink); border-color: transparent; }
button.wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; }
svg { flex-shrink: 0; }

.row {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 8px 10px; border-radius: var(--r-s);
  border: 1px solid transparent; cursor: pointer; margin-bottom: 2px;
}
.row:hover { background: var(--raised); }
.row.on { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.row input { margin: 5px 0 0; accent-color: var(--accent); }
.row .t { font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.row .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.row .grow { flex: 1; min-width: 0; }
.row .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .kill { opacity: 0; padding: 2px 6px; font-size: 15px; line-height: 1; }
.row:hover .kill, .row.on .kill { opacity: .8; }
.row .kill:hover { color: var(--bad); opacity: 1; }

.blank { color: var(--muted); font-size: 12.5px; padding: 6px 4px; }
.toggle { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 4px; }
.toggle input { accent-color: var(--accent); }
.hint-s { font-size: 11.5px; color: var(--muted); margin: 7px 4px 0; line-height: 1.45; }

/* ---------- tabs ---------- */

.tabs { display: flex; gap: 2px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.tab {
  border: none; background: none; border-radius: 0; padding: 12px 13px 10px;
  font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent;
}
.tab:hover { background: none; color: var(--ink-2); border-color: transparent; border-bottom-color: var(--line); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 550; }

.pane { flex: 1; display: none; flex-direction: column; min-height: 0; min-width: 0; }
.pane.on { display: flex; }

/* ---------- chat ---------- */

#log { flex: 1; overflow-y: auto; padding: 26px 20px 8px; }
.thread { max-width: 720px; margin: 0 auto; }
.msg { margin-bottom: 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .body {
  background: var(--accent-bg); color: var(--ink);
  border-radius: var(--r) var(--r) 3px var(--r);
  padding: 9px 14px; max-width: 80%; white-space: pre-wrap;
}
.msg.bot .who {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
}
.msg.bot .body { white-space: pre-wrap; }
.msg.bot.no .body {
  border-left: 2px solid var(--amber); background: var(--amber-bg);
  padding: 10px 14px; border-radius: 0 var(--r-s) var(--r-s) 0;
}
.flag { font-size: 10.5px; letter-spacing: .04em; color: var(--amber); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }

.sources { margin-top: 12px; }
.sources .cap { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: var(--r-s); padding: 4px 10px 4px 6px; color: var(--ink-2);
}
.chip b {
  font-size: 10.5px; font-weight: 700; color: var(--accent);
  background: var(--accent-bg); border-radius: 4px; padding: 1px 5px;
}

details.tr { margin-top: 12px; }
details.tr summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; }
details.tr summary::-webkit-details-marker { display: none; }
details.tr summary::before { content: "▸ "; }
details.tr[open] summary::before { content: "▾ "; }
details.tr .in { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
details.tr table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
details.tr td { padding: 6px 10px; border-top: 1px solid var(--line-soft); color: var(--ink-2); }
details.tr tr:first-child td { border-top: none; }
details.tr tr.used td { background: var(--raised); }
details.tr td.k { color: var(--good); font-size: 11px; letter-spacing: .04em; }
details.tr td.n { font-variant-numeric: tabular-nums; color: var(--muted); }

.dots span { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .18s; }
.dots span:nth-child(3) { animation-delay: .36s; }
@keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

.welcome { max-width: 720px; margin: 8vh auto 0; text-align: center; }
.welcome h2 { font-size: 19px; margin-bottom: 6px; }
.welcome p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
.seeds { display: flex; flex-direction: column; gap: 8px; max-width: 460px; margin: 0 auto; }
.seed { text-align: left; background: var(--panel); box-shadow: var(--shadow); font-size: 13.5px; color: var(--ink-2); padding: 10px 13px; }
.seed:hover { color: var(--ink); }

#composer { flex-shrink: 0; padding: 12px 20px 18px; }
.box {
  max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: var(--r); padding: 7px 7px 7px 13px;
}
.box:focus-within { border-color: var(--accent); }
#q {
  flex: 1; font: inherit; border: none; background: none; color: var(--ink);
  resize: none; padding: 6px 0; max-height: 150px; outline: none;
}
.send { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: var(--r-s); }

/* ---------- evaluation ---------- */

#evalPane { overflow-y: auto; padding: 24px 20px 40px; }
.sheet { max-width: 880px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
.card > h3 { font-size: 14px; }
.card > .sub { color: var(--muted); font-size: 13px; margin: 5px 0 0; }
.actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.track { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.track > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
.say { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.say.err { color: var(--bad); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 15px 16px; }
.kpi .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 6px 0 2px; line-height: 1.1; }
.kpi .met { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.kpi .meter { height: 4px; background: var(--meter-track); border-radius: 999px; margin: 11px 0 9px; overflow: hidden; }
.kpi .meter > i { display: block; height: 100%; background: var(--meter-fill); border-radius: 999px; }
.kpi .det { font-size: 11.5px; color: var(--muted); line-height: 1.45; }


table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
table.grid th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.grid tr:last-child td { border-bottom: none; }
table.grid td.n { font-variant-numeric: tabular-nums; }
table.grid td.id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; padding: 1.5px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.pill.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.scroll { overflow-x: auto; margin: 4px -6px 0; padding: 0 6px; }
.foot { font-size: 11.5px; color: var(--muted); margin-top: 12px; }
#label {
  font: inherit; font-size: 13.5px; flex: 1; min-width: 180px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 7px 11px;
}
#label:focus { outline: none; border-color: var(--accent); }
.runrow {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px;
  border-radius: var(--r-s); cursor: pointer; border: 1px solid transparent;
}
.runrow:hover { background: var(--raised); }
.runrow.on { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.runrow .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.runrow .what { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runrow .mini { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.runrow .mini b { font-weight: 600; }
.runrow .kill { opacity: 0; padding: 2px 6px; font-size: 15px; line-height: 1; }
.runrow:hover .kill { opacity: .8; }
ul.fails { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
ul.fails li { margin-bottom: 4px; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  aside { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
  .kpis { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="mark">R</div>
  <h1>RAG Document Chatbot</h1>
  <div class="status" id="status"><span class="dot off"></span><span>connecting</span></div>
</header>

<main>
  <aside>
    <section>
      <div class="legend">Documents <span class="count" id="docCount"></span></div>
      <button class="wide" id="pick">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M5 6l3-3 3 3M2.5 11v2h11v-2"/></svg>
        Upload a PDF
      </button>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <p class="hint-s" id="upNote"></p>
      <div id="docs" style="margin-top:10px"></div>
    </section>

    <section>
      <div class="legend">Chats <button class="ghost" id="newChat" title="Start a new conversation">+ New</button></div>
      <div id="chats"></div>
    </section>

    <section>
      <div class="legend">Options</div>
      <label class="toggle"><input type="checkbox" id="debug"> Show what was retrieved</label>
      <p class="hint-s">Adds the retrieved chunks and their scores under each answer.</p>
    </section>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0">
    <div class="tabs">
      <button class="tab on" data-tab="chat">Chat</button>
      <button class="tab" data-tab="eval">Evaluation</button>
    </div>

    <div class="pane on" id="chatPane">
      <div id="log"></div>
      <form id="composer">
        <div class="box">
          <textarea id="q" rows="1" placeholder="Ask something about the document…"></textarea>
          <button class="primary send" id="send" type="submit" title="Send">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
          </button>
        </div>
      </form>
    </div>

    <div class="pane" id="evalPane">
      <div class="sheet">
        <div class="card">
          <h3>Evaluation set</h3>
          <p class="sub">20 questions through the same path a real request takes. About a minute.</p>
          <div class="actions">
            <input id="label" placeholder="What changed? (optional label)" maxlength="120">
            <button class="primary" id="run">Run evaluation</button>
            <label class="toggle"><input type="checkbox" id="judge" checked> Judge the answers</label>
            <span class="say" id="says"></span>
          </div>
          <div class="track" id="track" hidden><i></i></div>
          <p class="say err" id="errs"></p>
        </div>
        <div id="history"></div>
        <div id="out"></div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SEEDS = [
  'What are the eligibility requirements?',
  'What is the maximum amount allowed?',
  'Who is responsible for this process?',
];

let chats = [], activeId = null, docId = null, timer = null;

/* ---------- plumbing ---------- */

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(
      body.error ? body.error.message
      : Array.isArray(body.detail) ? body.detail.map(d => d.msg).join('; ')
      : body.detail || res.statusText);
  }
  return body;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
const pct = (v) => v === null || v === undefined ? '—' : Math.round(v * 100) + '%';

/* ---------- conversations ----------
   Stored server side, so they survive a cleared browser and can be read back
   with their citations and retrieval traces intact. The chat endpoint is still
   stateless underneath: pass `history` instead of a conversation_id and nothing
   is written, which is the path the evaluation uses. */

const active = () => chats.find(c => c.id === activeId);
const POST = (body) => ({
  method: 'POST', headers: { 'content-type': 'application/json' },
  body: JSON.stringify(body),
});

async function loadChats() {
  try { chats = await api('/conversations'); } catch { chats = []; }
  if (!chats.length) return newChat();
  if (!chats.some(c => c.id === activeId)) activeId = chats[0].id;
  drawChats();
  await openChat(activeId);
}

async function newChat() {
  try {
    const created = await api('/conversations', POST({}));
    chats.unshift(created);
    activeId = created.id;
  } catch (e) {
    $('upNote').textContent = e.message;
    return;
  }
  drawChats(); drawLog(); $('q').focus();
}

async function openChat(id) {
  activeId = id;
  drawChats();
  try {
    const full = await api('/conversations/' + id);
    const at = chats.findIndex(c => c.id === id);
    if (at >= 0) chats[at] = full;
  } catch { /* leave what we have */ }
  drawLog();
}

async function dropChat(id, ev) {
  ev.stopPropagation();
  try { await api('/conversations/' + id, { method: 'DELETE' }); } catch {}
  chats = chats.filter(c => c.id !== id);
  if (activeId === id) activeId = chats.length ? chats[0].id : null;
  if (!chats.length) return newChat();
  drawChats(); await openChat(activeId);
}

function drawChats() {
  const box = $('chats');
  box.innerHTML = '';
  for (const c of chats) {
    const row = el('div', 'row' + (c.id === activeId ? ' on' : ''));
    const grow = el('div', 'grow');
    grow.append(el('div', 't clip', c.title));
    row.append(grow);
    const kill = el('button', 'ghost kill', '×');
    kill.title = 'Delete this conversation';
    kill.onclick = (ev) => dropChat(c.id, ev);
    row.append(kill);
    row.onclick = () => openChat(c.id);
    box.append(row);
  }
}

/* ---------- chat rendering ---------- */

function drawLog() {
  const log = $('log');
  log.innerHTML = '';
  const chat = active();

  if (!chat || !(chat.messages || []).length) {
    const w = el('div', 'welcome');
    w.append(el('h2', null, 'Ask the document'));
    w.append(el('p', null, 'Answers come only from what was retrieved, with the page and section they came from.'));
    const seeds = el('div', 'seeds');
    for (const s of SEEDS) {
      const b = el('button', 'seed', s);
      b.onclick = () => { $('q').value = s; $('composer').requestSubmit(); };
      seeds.append(b);
    }
    w.append(seeds);
    log.append(w);
    return;
  }

  const thread = el('div', 'thread');
  for (const m of chat.messages) thread.append(drawTurn(m));
  log.append(thread);
  log.scrollTop = log.scrollHeight;
}

function drawTurn(t) {
  if (t.role === 'user') {
    const n = el('div', 'msg user');
    n.append(el('div', 'body', t.content));
    return n;
  }
  const refused = t.refused || t.answerable === false;
  const n = el('div', 'msg bot' + (refused ? ' no' : ''));
  const who = el('div', 'who');
  who.append(el('span', null, 'Assistant'));
  if (refused) who.append(el('span', 'flag', 'NOT IN THE DOCUMENT'));
  n.append(who);
  n.append(el('div', 'body', t.content));

  if (t.citations && t.citations.length) {
    const box = el('div', 'sources');
    box.append(el('div', 'cap', t.citations.length === 1 ? 'Source' : 'Sources'));
    const chips = el('div', 'chips');
    t.citations.forEach((c, i) => {
      const chip = el('span', 'chip');
      chip.append(el('b', null, String(i + 1)), el('span', null, c.display));
      chips.append(chip);
    });
    box.append(chips);
    n.append(box);
  }
  if (t.trace) n.append(drawTrace(t.trace));
  return n;
}

function drawTrace(tr) {
  const d = el('details', 'tr');
  const bits = [`${tr.retrieved.length} chunks retrieved`];
  if (tr.rewritten_query) bits.push(`rewritten to "${tr.rewritten_query}"`);
  if (tr.guards && tr.guards.length) bits.push(`guards: ${tr.guards.join(', ')}`);
  d.append(el('summary', null, bits.join(' · ')));

  const wrap = el('div', 'in');
  const table = el('table');
  for (const it of tr.retrieved) {
    const row = el('tr', it.used_as_evidence ? 'used' : '');
    row.append(el('td', it.used_as_evidence ? 'k' : 'n', it.used_as_evidence ? 'EVIDENCE' : '—'));
    row.append(el('td', 'n', it.score.toFixed(3)));
    row.append(el('td', 'n', 'p' + it.page_start + (it.page_end !== it.page_start ? '–' + it.page_end : '')));
    row.append(el('td', null, it.section || ''));
    table.append(row);
  }
  wrap.append(table);
  d.append(wrap);
  return d;
}

/* ---------- status and documents ---------- */

async function drawStatus() {
  const box = $('status');
  try {
    const h = await api('/health');
    box.innerHTML = '';
    box.append(el('span', 'dot'), el('span', null,
      `${h.documents} document${h.documents === 1 ? '' : 's'} · ${h.chunks} chunks`));
  } catch {
    box.innerHTML = '';
    box.append(el('span', 'dot off'), el('span', null, 'API unreachable'));
  }
}

async function drawDocs() {
  const box = $('docs');
  box.innerHTML = '';
  let docs = [];
  try { docs = await api('/documents'); } catch { /* the status pill says so */ }

  $('docCount').textContent = docs.length ? `(${docs.length})` : '';
  if (!docs.length) {
    box.append(el('p', 'blank', 'Nothing indexed yet.'));
    return;
  }
  box.append(docRow('All documents', `search across ${docs.length}`, null));
  for (const d of docs) {
    box.append(docRow(d.title || d.filename, `${d.pages} pages · ${d.chunks} chunks`, d.doc_id));
  }
}

function docRow(name, meta, id) {
  const row = el('label', 'row' + (docId === id ? ' on' : ''));
  const radio = el('input');
  radio.type = 'radio'; radio.name = 'doc'; radio.checked = docId === id;
  radio.onchange = () => { docId = id; drawDocs(); };
  const grow = el('div', 'grow');
  grow.append(el('div', 't', name), el('div', 's', meta));
  row.append(radio, grow);

  if (id) {
    const kill = el('button', 'ghost kill', '×');
    kill.title = 'Remove this document and its chunks';
    kill.onclick = async (ev) => {
      ev.preventDefault(); ev.stopPropagation();   // do not also tick the radio
      if (!confirm(`Remove "${name}" from the index?`)) return;
      try {
        await api('/documents/' + id, { method: 'DELETE' });
        if (docId === id) docId = null;
        $('upNote').textContent = `Removed ${name}.`;
        await Promise.all([drawStatus(), drawDocs()]);
      } catch (e) { $('upNote').textContent = e.message; }
    };
    row.append(kill);
  }
  return row;
}

/* ---------- ingestion ---------- */

$('pick').onclick = () => $('file').click();
$('file').onchange = async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const note = $('upNote');
  note.textContent = `Indexing ${file.name}…`;
  $('pick').disabled = true;

  const form = new FormData();
  form.append('file', file);
  try {
    const r = await api('/ingest', { method: 'POST', body: form });
    note.textContent = r.duplicate
      ? `${r.filename} was already indexed.`
      : `Indexed ${r.filename}: ${r.pages} pages, ${r.chunks} chunks.`;
    await Promise.all([drawStatus(), drawDocs()]);
  } catch (e) {
    note.textContent = e.message;
  } finally {
    $('pick').disabled = false;
    ev.target.value = '';
  }
};

/* ---------- sending ---------- */

$('composer').onsubmit = async (ev) => {
  ev.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;

  const chat = active();
  if (!chat) return;

  chat.messages = chat.messages || [];
  chat.messages.push({ role: 'user', content: question });
  if (chat.messages.length === 1) {
    chat.title = question.length > 40 ? question.slice(0, 40) + '…' : question;
    drawChats();
  }
  $('q').value = ''; $('q').style.height = 'auto';
  $('send').disabled = true;
  drawLog();

  const wait = el('div', 'msg bot');
  const who = el('div', 'who');
  who.append(el('span', null, 'Assistant'));
  wait.append(who);
  const dots = el('div', 'dots');
  dots.append(el('span'), el('span'), el('span'));
  wait.append(dots);
  $('log').querySelector('.thread').append(wait);
  $('log').scrollTop = $('log').scrollHeight;

  try {
    // The server owns the history for a stored conversation, so none is sent.
    const r = await api('/chat', POST({
      question, doc_id: docId, conversation_id: chat.id, debug: $('debug').checked,
    }));
    chat.messages.push({
      role: 'assistant', content: r.answer, citations: r.citations,
      answerable: r.answerable, trace: r.trace || null,
    });
  } catch (e) {
    chat.messages.push({ role: 'assistant', content: e.message, answerable: false });
  } finally {
    drawLog();
    $('send').disabled = false;
    $('q').focus();
  }
};

$('q').oninput = (ev) => {
  ev.target.style.height = 'auto';
  ev.target.style.height = Math.min(ev.target.scrollHeight, 150) + 'px';
};
$('q').onkeydown = (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('composer').requestSubmit(); }
};
$('newChat').onclick = newChat;

/* ---------- evaluation ---------- */

$('run').onclick = async () => {
  $('run').disabled = true;
  $('errs').textContent = '';
  $('out').innerHTML = '';
  $('track').hidden = false;
  try {
    drawEval(await api('/eval/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        doc_id: docId, label: $('label').value.trim() || null,
        judge: $('judge').checked,
      }),
    }));
    poll();
  } catch (e) {
    $('errs').textContent = e.message;
    $('run').disabled = false;
    $('track').hidden = true;
  }
};

function poll() {
  if (timer) return;
  $('run').disabled = true;
  $('track').hidden = false;
  timer = setInterval(async () => {
    try { drawEval(await api('/eval/status')); }
    catch (e) { $('errs').textContent = e.message; halt(); }
  }, 1000);
}
function halt() { clearInterval(timer); timer = null; $('run').disabled = false; }

function drawEval(s) {
  $('track').querySelector('i').style.width = s.total ? (s.done / s.total) * 100 + '%' : '0';
  $('says').textContent = s.running
    ? `Question ${s.done} of ${s.total}…`
    : s.total ? `Finished ${s.done} of ${s.total} questions.` : '';
  if (s.error) $('errs').textContent = s.error;
  if (s.running) return poll();
  if (timer) halt();
  drawHistory();
  if (!s.summary) return;

  const out = $('out');
  out.innerHTML = '';
  if (s.headline.length) out.append(kpiRow(s.headline));
  if (s.breakdown && s.breakdown.length) out.append(byCategory(s.breakdown));
  out.append(perQuestion(s.rows));
}

/* A handful of headline numbers is a KPI row, not a chart. Each is a share of a
   whole, so each gets a meter. All four are phrased higher-is-better, so a fuller
   bar always means better. */
function kpiRow(tiles) {
  const row = el('div', 'kpis');
  for (const t of tiles) {
    const card = el('div', 'kpi');
    card.append(el('div', 'lbl', t.label));
    card.append(el('div', 'val', pct(t.value)));
    const meter = el('div', 'meter');
    const fill = el('i');
    fill.style.width = Math.round((t.value || 0) * 100) + '%';
    meter.append(fill);
    card.append(meter);
    card.append(el('div', 'met', t.note));
    row.append(card);
  }
  return row;
}

/* The same five metrics per category. This is the view that says *where* the
   system is weak, which a single set of averages cannot. */
function byCategory(groups) {
  const card = el('div', 'card');
  card.append(el('h3', null, 'By category'));

  const table = el('table', 'data');
  const head = el('tr');
  for (const c of ['Category', 'n', 'Retrieval', 'Correctness', 'Groundedness', 'Citations', 'Abstention']) {
    head.append(el('th', null, c));
  }
  table.append(head);

  for (const g of groups) {
    const tr = el('tr');
    tr.append(el('td', null, g.type.replace(/_/g, ' ')));
    tr.append(el('td', 'num', String(g.count)));
    for (const key of ['retrieval', 'correctness', 'groundedness', 'citation_support', 'abstention']) {
      tr.append(el('td', 'num', pct(g[key])));
    }
    table.append(tr);
  }
  const scroll = el('div', 'scroll');
  scroll.append(table);
  card.append(scroll);
  return card;
}

function perQuestion(rows) {
  const card = el('div', 'card');
  card.append(el('h3', null, 'Per question'));

  const table = el('table', 'grid');
  const head = el('tr');
  for (const c of ['ID', 'Type', 'Outcome', 'Recall', 'Corr', 'Grnd', 'Cite']) {
    head.append(el('th', null, c));
  }
  table.append(head);

  for (const r of rows) {
    const tr = el('tr');
    tr.append(el('td', 'id', r.id));
    tr.append(el('td', null, r.doc || '—'));
    tr.append(el('td', null, r.type.replace(/_/g, ' ')));
    tr.append(el('td', null, r.should_be_answerable ? 'answer' : 'refuse'));

    const got = el('td');
    got.append(el('span', 'pill ' + (r.should_be_answerable === r.answerable ? 'ok' : 'no'),
      r.answerable ? 'answered' : 'refused'));
    tr.append(got);

    tr.append(el('td', 'num', r.recall === null || r.recall === undefined ? '—' : pct(r.recall)));
    for (const key of ['correctness', 'groundedness', 'citation_support']) {
      tr.append(scoreCell(r[key]));
    }
    tr.append(el('td', null, r.citations.join('; ') || '—'));
    tr.title = [r.answer, r.judge_reason && 'Judge: ' + r.judge_reason]
      .filter(Boolean).join('\n\n');
    table.append(tr);
  }
  const scroll = el('div', 'scroll');
  scroll.append(table);
  card.append(scroll);

  const bad = rows.filter(r =>
    r.should_be_answerable !== r.answerable ||
    (r.recall !== null && r.recall !== undefined && r.recall < 1) ||
    ['correctness', 'groundedness', 'citation_support', 'completeness']
      .some(k => r[k] !== null && r[k] !== undefined && r[k] < 2));
  if (bad.length) {
    card.append(el('h3', null, 'Worth a look'));
    const list = el('ul', 'fails');
    for (const r of bad) {
      list.append(el('li', null,
        `${r.id} (${r.type.replace(/_/g, ' ')}): ${r.question}` +
        (r.judge_reason ? ' — ' + r.judge_reason : '')));
    }
    card.append(list);
  }
  card.append(el('p', 'foot', 'Hover a row for the question, answer, sources and the judge’s reason.'));
  return card;
}

/* Judge scores are 0, 1 or 2. A blank means the question was not judged, which
   is different from scoring zero. */
function scoreCell(v) {
  if (v === null || v === undefined) return el('td', 'num', '-');
  const td = el('td', 'num');
  td.append(el('span', 'pill ' + (v === 2 ? 'ok' : v === 0 ? 'no' : ''), String(v)));
  return td;
}

/* ---------- run history ----------
   Tuning a RAG system is comparing this run with the one before it, so every
   run is kept together with the settings that produced it. */

async function drawHistory() {
  const box = $('history');
  let runs = [];
  try { runs = await api('/eval/runs'); } catch { return; }
  box.innerHTML = '';
  if (!runs.length) return;

  const card = el('div', 'card');
  card.append(el('h3', null, `Previous runs (${runs.length})`));

  for (const r of runs) {
    const row = el('div', 'runrow');
    row.append(el('span', 'when', (r.started_at || '').replace('T', ' ').replace('+00:00', '')));
    row.append(el('span', 'what', r.label || (r.status === 'done' ? 'unlabelled run' : r.status)));

    const mini = el('div', 'mini');
    if (r.status === 'done') {
      for (const t of (r.headline || []).slice(0, 3)) {
        const cell = el('span');
        cell.append(el('span', null, t.label.slice(0, 4).toLowerCase() + ' '),
                    el('b', null, pct(t.value)));
        cell.title = t.metric;
        mini.append(cell);
      }
      const k = r.knobs || {};
      if (k.retriever_top_k) mini.append(el('span', null, `k=${k.retriever_top_k}`));
      if (k.chunk_tokens) mini.append(el('span', null, `chunk=${k.chunk_tokens}`));
    } else {
      mini.append(el('span', null, r.error ? 'failed' : r.status));
    }
    row.append(mini);

    const kill = el('button', 'ghost kill', '×');
    kill.title = 'Delete this run';
    kill.onclick = async (ev) => {
      ev.stopPropagation();
      try { await api('/eval/runs/' + r.run_id, { method: 'DELETE' }); await drawHistory(); }
      catch (e) { $('errs').textContent = e.message; }
    };
    row.append(kill);

    row.onclick = async () => {
      try {
        const full = await api('/eval/runs/' + r.run_id);
        document.querySelectorAll('.runrow').forEach(n => n.classList.remove('on'));
        row.classList.add('on');
        $('says').textContent = `Showing run ${r.run_id}${r.label ? ' - ' + r.label : ''}.`;
        drawEval(full);
      } catch (e) { $('errs').textContent = e.message; }
    };
    card.append(row);
  }
  box.append(card);
}

/* ---------- tabs and boot ---------- */

for (const tab of document.querySelectorAll('.tab')) {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
    $('chatPane').classList.toggle('on', tab.dataset.tab === 'chat');
    $('evalPane').classList.toggle('on', tab.dataset.tab === 'eval');
  };
}

loadChats();
drawStatus();
drawDocs();
drawHistory();
/* A run started before a reload is still going on the server, so pick it back up. */
api('/eval/status').then(s => { if (s.summary || s.running) drawEval(s); }).catch(() => {});
</script>
</body>
</html>
